name: Validate NISM quiz

on:
  push:
    branches: [main]
    paths:
      - nism-master-quiz/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check the self-contained quiz
        shell: bash
        run: |
          test -s nism-master-quiz/index.html
          grep -q '750 challenges' nism-master-quiz/index.html
          grep -q 'Stage 1 of 15' nism-master-quiz/index.html
          grep -q 'Bala is' nism-master-quiz/index.html
