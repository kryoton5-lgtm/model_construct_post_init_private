<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>NISM Chapter 3 Quiz</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f7fb;color:#172033}main{max-width:720px;margin:auto;padding:18px}h1{font-size:24px;margin:8px 0;color:#075cab}.sub{color:#5c667a;margin-bottom:20px}.card{background:white;border:1px solid #dfe5ee;border-radius:16px;padding:18px;margin:14px 0}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700}.pill{background:#eef4fb;padding:8px 12px;border-radius:999px}.q{font-size:20px;font-weight:700;line-height:1.45;margin:18px 0}.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #d8e0eb;border-radius:14px;padding:15px;margin:10px 0;font-size:17px;line-height:1.35;min-height:54px;-webkit-appearance:none;appearance:none;touch-action:manipulation}.opt:active{transform:scale(.99)}.good{border-color:#209447;background:#eaf8ee}.bad{border-color:#d64040;background:#fff0f0}.fb{padding:14px;border-radius:12px;margin-top:14px;line-height:1.45}.fb.good{color:#145b2b}.fb.bad{color:#8d2020}.primary{width:100%;border:0;border-radius:14px;padding:15px;background:#075cab;color:white;font-size:18px;font-weight:700;min-height:52px}.primary:disabled{opacity:.45}.timer{height:10px;background:#e7ebf0;border-radius:99px;overflow:hidden;margin-top:14px}.bar{height:100%;background:#2e9d50;width:100%}.hide{display:none}.score{font-size:40px;font-weight:800;color:#075cab;text-align:center}.review{font-size:14px;line-height:1.45;border-top:1px solid #e5e9ef;padding:12px 0}footer{text-align:center;color:#7a8495;font-size:12px;padding:18px}@media(max-width:480px){main{padding:12px}.card{padding:15px}.q{font-size:18px}.opt{font-size:16px}}</style></head><body><main><h1>NISM Series V-A — Chapter 3</h1><div class="sub">Legal Structure of Mutual Funds in India · 25-question mobile quiz</div><section id="start" class="card"><p>60 seconds per question. Options are shuffled. After each answer you immediately see whether it is correct and why.</p><button id="startBtn" class="primary">Start Quiz</button></section><section id="game" class="card hide"><div class="top"><span id="prog" class="pill"></span><span id="score" class="pill"></span></div><div class="timer"><div id="bar" class="bar"></div></div><div id="time" style="text-align:right;font-size:13px;color:#667085;margin-top:5px"></div><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb hide"></div><button id="next" class="primary" disabled>Next</button></section><section id="result" class="card hide"><div class="score" id="final"></div><p id="pct" style="text-align:center"></p><div id="review"></div><button id="again" class="primary">Play Again</button></section><footer>Chapter 3 practice quiz</footer></main><script>var Q=[
["As per SEBI (Mutual Fund) Regulations, a mutual fund is established in the form of a:",["Trust","Company","Partnership firm","Society"],"Trust","A mutual fund is established as a Trust, governed additionally by the Indian Trusts Act, 1882."],
["The mutual fund trust is created by the:",["Sponsor(s)","Custodian","Registrar and Transfer Agent","AMFI"],"Sponsor(s)","The mutual fund trust is created by one or more Sponsors, who are the main persons behind the mutual fund business."],
["Who are the beneficiaries of a mutual fund trust?",["Unit-holders","Trustees","Sponsors","Directors of the AMC"],"Unit-holders","The beneficiaries of the mutual fund trust are the investors who invest in the various schemes, called unit-holders."],
["The operations of a mutual fund trust are governed by a document executed between the sponsor and the trustees, called the:",["Trust Deed","Investment Management Agreement","Custodial Agreement","Scheme Information Document"],"Trust Deed","The Trust Deed is executed between the sponsors and the trustees and governs the operations of the mutual fund trust; SEBI prescribes clauses that must be part of it."],
["As per SEBI norms, a sponsor of a mutual fund must have been carrying on business in financial services for not less than:",["5 years","3 years","7 years","10 years"],"5 years","One of the sponsor eligibility criteria is carrying on business in financial services for not less than 5 years, with positive net worth in each of the preceding 5 years."],
["SEBI requires a mutual fund sponsor to have average net annual profits (after depreciation, interest and tax) during the immediately preceding five years of at least:",["Rs. 10 crore","Rs. 5 crore","Rs. 50 crore","Rs. 100 crore"],"Rs. 10 crore","The sponsor eligibility norms require average net annual profits after depreciation, interest and tax of at least Rs. 10 crore during the preceding five years."],
["Which regulation of the SEBI Mutual Fund Regulations lays down the eligibility criteria for appointment of trustees?",["Regulation 11","Regulation 3","Regulation 18","Regulation 25"],"Regulation 11","Regulation 11 of the SEBI Mutual Fund Regulations stipulates the eligibility criteria for appointment of trustees of a mutual fund."],
["As per Regulation 11, a person CANNOT be appointed as a trustee of a mutual fund if that person is:",["A director, officer or employee of an asset management company","A retired banker","A chartered accountant","A resident of India"],"A director, officer or employee of an asset management company","A person is not eligible to be a trustee if they are a director (including independent director), officer, or employee of an AMC, or a trustee of any other mutual fund."],
["At least what proportion of the trustees on the Board of a Trustee Company must be independent directors (not associated with the sponsor, AMC or trustee company)?",["Two-thirds","One-half","One-third","Three-fourths"],"Two-thirds","At least two-thirds of the trustees on the Board of the trustee company must be independent directors who are not associates of the sponsor, AMC or trustee company."],
["Whose approval is required before a person is appointed as a Trustee of a mutual fund?",["Prior approval of SEBI","Prior approval of AMFI","Prior approval of the RBI","Prior approval of the stock exchange"],"Prior approval of SEBI","Prior approval of SEBI needs to be taken before a person is appointed as Trustee of a mutual fund."],
["Day-to-day management of mutual fund schemes is handled by the:",["Asset Management Company (AMC)","Custodian","Trustees","Depository"],"Asset Management Company (AMC)","Day-to-day management of the schemes is handled by the AMC, which is appointed by the sponsor or the Trustees."],
["The board of directors of an Asset Management Company must comprise at least what percentage of directors who are not associates of the sponsor, its subsidiaries, or the trustees?",["50 percent","25 percent","33 percent","75 percent"],"50 percent","The board of directors of the AMC must comprise at least fifty percent directors who are not associates of the sponsor, or any of its subsidiaries, or the trustees."],
["As per SEBI Mutual Fund Regulations, the minimum net worth required for an Asset Management Company (effective from January 01, 2024) is:",["Rs. 50 crore","Rs. 10 crore","Rs. 100 crore","Rs. 25 crore"],"Rs. 50 crore","The AMC is required to have a net worth of not less than Rs. 50 crore deployed in assets as specified, effective January 01, 2024, maintained on a continuous basis."],
["The appointment of an AMC can be terminated by a majority of the trustees, or by what percentage of unit-holders?",["75 percent","51 percent","90 percent","60 percent"],"75 percent","The appointment of an AMC can be terminated by a majority of the trustees, or by 75 percent of the unit-holders, subject to prior approval of SEBI and the unit-holders for any change in AMC."],
["In the event of a change in control of the AMC, unit-holders are given the option to exit at the prevailing NAV without any exit load, within a time period of not less than:",["30 calendar days from the date of communication","7 calendar days from the date of communication","60 calendar days from the date of communication","15 calendar days from the date of communication"],"30 calendar days from the date of communication","Unit-holders must be given the option to exit on the prevailing NAV, without any exit load, within a period of not less than 30 calendar days from the date of communication about the change in control of the AMC."],
["Custody of the assets of a mutual fund scheme is the responsibility of the:",["Custodian","Registrar and Transfer Agent","Fund Accountant","Sales and Marketing team"],"Custodian","Although the AMC manages the schemes, custody of the scheme assets is with the Custodian, appointed by the Trustees under a custodial agreement."],
["Custodians in India are required to register with SEBI under the:",["SEBI (Custodian) Regulations, 1996","SEBI (Mutual Fund) Regulations","SEBI (Depositories) Regulations","Indian Trusts Act, 1882"],"SEBI (Custodian) Regulations, 1996","All custodians need to register with SEBI under the SEBI (Custodian) Regulations, 1996."],
["Within the organisation structure of an AMC, who is responsible for signing a due-diligence certificate confirming that all regulations have been complied with in the scheme documents of new issues?",["The Compliance Officer","The Fund Manager","The Dealer","The Custodian"],"The Compliance Officer","The Compliance Officer signs a due-diligence certificate in scheme documents of new issues and reports any non-compliance directly to the Trustees."],
["Within the Fund Management team of an AMC, whose responsibility is it to place orders with securities brokers based on the fund manager's instructions?",["Dealers","Analysts","Compliance Officers","Registrar and Transfer Agents"],"Dealers","The fund management team is split into analysts, fund managers and dealers; dealers place orders with brokers as instructed by fund managers."],
["Which team within an AMC maintains the books of accounts of each individual mutual fund scheme and calculates the NAV on a daily basis?",["Fund Accounting team","Sales and Marketing team","Administration team","Human Resources team"],"Fund Accounting team","The Fund Accounting team maintains books of accounts of each individual scheme and calculates NAV on a daily basis."],
["Which service provider maintains investor records, processes purchase/redemption/switch requests and generates account statements for mutual fund investors?",["Registrar and Transfer Agent (RTA)","Custodian","Valuation Agency","Credit Rating Agency"],"Registrar and Transfer Agent (RTA)","The RTA maintains investor records, processes transactions, updates folios and generates account statements."],
["The auditor who audits the accounts of a mutual fund scheme must be:",["Different from the auditor of the AMC","The same as the auditor of the AMC","Appointed by the AMC only","Appointed by AMFI"],"Different from the auditor of the AMC","Scheme accounts must be maintained independently of AMC accounts, and the auditor for scheme accounts must be different from the AMC's auditor."],
["To be empanelled as a mutual fund distributor and obtain an ARN, a candidate is required to clear the:",["NISM-Series-V-A: Mutual Fund Distributors Certification Examination","NISM-Series-I Examination","NISM-Series-X-A Examination","Chartered Financial Analyst Examination"],"NISM-Series-V-A: Mutual Fund Distributors Certification Examination","Distributors must pass the NISM-Series-V-A Mutual Fund Distributors Certification Examination and register with AMFI to obtain an ARN."],
["For valuation of non-traded or thinly traded debt securities for the purpose of computing mutual fund NAV, AMFI has appointed which agencies to provide the valuation matrix?",["CRISIL Ltd. and ICRA Ltd.","NSDL and CDSL","BSE and NSE","RBI and SEBI"],"CRISIL Ltd. and ICRA Ltd.","AMFI has appointed CRISIL Ltd. and ICRA Ltd. to provide the valuation matrix for fair valuation of non-traded/thinly traded debt securities."],
["Which of the following statements about the Association of Mutual Funds in India (AMFI) is correct?",["AMFI is an association of Asset Management Companies and is neither a regulator nor a Self-Regulatory Organisation (SRO)","AMFI is the statutory regulator of the Indian mutual fund industry","AMFI is a Self-Regulatory Organisation (SRO) recognised by SEBI","AMFI is a government department that oversees mutual funds"],"AMFI is an association of Asset Management Companies and is neither a regulator nor a Self-Regulatory Organisation (SRO)","AMFI is the association of all registered AMCs; it is neither a regulatory body nor an SRO. SEBI remains the statutory regulator."]];
var order=[],i=0,sc=0,answered=false,timer,left=60,res=[];function $(x){return document.getElementById(x)}function sh(a){a=a.slice();for(var j=a.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1)),t=a[j];a[j]=a[k];a[k]=t}return a}function begin(){order=sh(Q.map(function(_,n){return n}));i=0;sc=0;res=[];$('start').className='card hide';$('result').className='card hide';$('game').className='card';load()}function load(){answered=false;clearInterval(timer);left=60;var x=Q[order[i]];$('prog').textContent='Question '+(i+1)+' / '+Q.length;$('score').textContent='Score: '+sc;$('q').textContent=(i+1)+'. '+x[0];$('opts').innerHTML='';sh(x[1]).forEach(function(o,n){var b=document.createElement('button');b.className='opt';b.type='button';b.textContent='ABCD'[n]+'. '+o;b.addEventListener('click',function(){pick(o,b)});$('opts').appendChild(b)});$('fb').className='fb hide';$('next').disabled=true;tickUI();timer=setInterval(function(){left--;tickUI();if(left<=0){clearInterval(timer);timeout()}},1000)}function tickUI(){$('time').textContent=left+'s remaining';$('bar').style.width=(left/60*100)+'%'}function pick(o,b){if(answered)return;answered=true;clearInterval(timer);var x=Q[order[i]],ok=o===x[2];if(ok)sc++;Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(z){var v=z.textContent.slice(3);z.disabled=true;if(v===x[2])z.classList.add('good');else if(z===b)z.classList.add('bad')});$('score').textContent='Score: '+sc;$('fb').className='fb '+(ok?'good':'bad');$('fb').textContent=(ok?'Correct. ':'Incorrect. Correct answer: '+x[2]+'. ')+x[3];$('next').disabled=false;res.push([x,o,ok])}function timeout(){if(answered)return;answered=true;var x=Q[order[i]];Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(z){z.disabled=true;if(z.textContent.slice(3)===x[2])z.classList.add('good')});$('fb').className='fb bad';$('fb').textContent='Time up. Correct answer: '+x[2]+'. '+x[3];$('next').disabled=false;res.push([x,null,false])}function next(){if(!answered)return;i++;if(i>=Q.length)finish();else load()}function finish(){clearInterval(timer);$('game').className='card hide';$('result').className='card';$('final').textContent=sc+' / '+Q.length;$('pct').textContent=Math.round(sc/Q.length*100)+'% correct';var h='';res.forEach(function(r,n){h+='<div class="review"><b>'+(n+1)+'. '+r[0][0]+'</b><br>Your answer: '+(r[1]||'No answer')+'<br><span style="color:#16713a">Correct: '+r[0][2]+'</span><br>'+r[0][3]+'</div>'});$('review').innerHTML=h} $('startBtn').addEventListener('click',begin);$('again').addEventListener('click',begin);$('next').addEventListener('click',next);</script></body></html>
